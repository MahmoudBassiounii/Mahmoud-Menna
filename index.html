<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b1a25">
<title>فرح محمود ومنه الله | Mahmoud &amp; Menna Allah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Parisienne&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#5b1a25; --wine-d:#3f0f18; --card:#fbf6ee; --card2:#f2e8dc; --ink:#6a1f2c; --soft:#8c6a6a; --gold:#c49a52; --rose:#e6c6c9; --line:rgba(106,31,44,.35);
  --u:min(1vw,.55vh); --u:min(1vw,.55svh);
  --f-display:'Aref Ruqaa','Amiri',serif; --f-body:'Tajawal','Segoe UI',Tahoma,sans-serif; --f-script:'Parisienne','Cormorant Garamond',cursive;
  --ease:cubic-bezier(.55,0,.25,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --wine:#3d0f17; --wine-d:#2a0a10; --card:#f4ebdf; --card2:#e9dccd; }
}
:root[data-theme="dark"]{ --wine:#3d0f17; --wine-d:#2a0a10; --card:#f4ebdf; --card2:#e9dccd; }
:root[lang="en"]{ --f-display:'Cormorant Garamond','Georgia',serif; --f-body:'Cormorant Garamond','Georgia',serif; }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; scrollbar-width:none; -ms-overflow-style:none; }
html::-webkit-scrollbar,body::-webkit-scrollbar{ display:none; }
html,body{ margin:0; min-height:100%; }
body{ background:radial-gradient(120% 80% at 50% 25%, var(--wine), var(--wine-d)); background-attachment:fixed; color:var(--ink); font-family:var(--f-body); font-size:18px; line-height:1.8; overflow-x:hidden; }
:root[lang="en"] body{ font-size:21px; line-height:1.5; }
body.locked{ overflow:hidden; height:100%; }
img,svg{ max-width:100%; }
button{ font:inherit; color:inherit; cursor:pointer; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:6px; }
.defs{ position:absolute; width:0; height:0; overflow:hidden; }
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:300; }

/* ===== layers (bottom to top): lining 5, main 12, flora 14, critters 15, front 20, flap 30, seal 31 ===== */
#lining{ position:fixed; inset:0; z-index:5; background:linear-gradient(180deg,#cdbfae 0%,#e7dccd 16%,#f1e8da 100%); transition:transform 4.2s var(--ease); }
#lining::after{ content:""; position:absolute; left:0; right:0; top:0; height:9%; background:linear-gradient(180deg,rgba(60,40,30,.28),transparent); }
#front{ position:fixed; inset:0; z-index:20; filter:drop-shadow(0 -6px 14px rgba(70,45,30,.32)); transition:transform 4.2s var(--ease); will-change:transform; }
#front .p{ position:absolute; inset:0; }
#front .left{ clip-path:polygon(0 0,50.4% 46%,50.4% 100%,0 100%); background:#e8decf; }
#front .right{ clip-path:polygon(100% 0,49.6% 46%,49.6% 100%,100% 100%); background:#efe6d9; }
#front .bottom{ clip-path:polygon(0 100%,100% 100%,54.5% 61%,52% 58.4%,50% 57.6%,48% 58.4%,45.5% 61%); background:#ece2d4; }
#front .p > svg.tx{ position:absolute; inset:0; width:100%; height:100%; }
#front .p::after{ content:""; position:absolute; inset:0; pointer-events:none; }
#front .left::after{ background:linear-gradient(90deg,rgba(90,60,40,.16),transparent 75%); }
#front .right::after{ background:linear-gradient(270deg,rgba(255,255,255,.28),transparent 70%); }
#front .bottom::after{ background:linear-gradient(0deg,rgba(90,60,40,.10),rgba(255,255,255,.18) 80%); }
#front svg.ed{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#flapw{ position:fixed; inset:0; z-index:30; filter:drop-shadow(0 8px 10px rgba(70,45,30,.38)); transition:transform 2.3s var(--ease) .45s; will-change:transform; }
#flap{ position:absolute; inset:0; clip-path:polygon(0 0,100% 0,50.7% 46.2%,50% 47.2%,49.3% 46.2%); background:#f2eadf; }
#flap > svg.tx{ position:absolute; inset:0; width:100%; height:100%; }
#flap::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 70%); }
#sealw{ position:fixed; left:50%; top:46.5%; z-index:31; transform:translate(-50%,-50%); transition:transform 2.3s var(--ease) .45s; background:none; border:0; padding:0; }
#sealw .wax{ display:block; width:calc(var(--u)*21); max-width:116px; min-width:78px; height:auto; filter:drop-shadow(0 5px 5px rgba(70,40,20,.45)); }
#sealw .shine{ position:absolute; inset:0; border-radius:50%; overflow:hidden; pointer-events:none; }
#sealw .shine::after{ content:""; position:absolute; top:-20%; bottom:-20%; width:30%; left:-40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent); transform:skewX(-18deg); animation:sheen 3.2s ease-in-out infinite; }
@keyframes sheen{ 0%,55%{ left:-40%;} 100%{ left:120%;} }
.gate-lang{ position:fixed; z-index:40; top:calc(14px + env(safe-area-inset-top,0px)); inset-inline-end:14px; background:rgba(255,255,255,.6); color:#6a1f2c; border:1px solid rgba(106,31,44,.35); border-radius:999px; padding:.1em .9em; font-size:.9rem; }
.welcome{ position:fixed; z-index:32; top:calc(13% + env(safe-area-inset-top,0px)); left:50%; width:min(88vw,420px); padding:0 14px; color:#6a1f2c; text-align:center; transform:translateX(-50%); pointer-events:none; animation:welcomeIn 1s .35s both; }
.welcome p{ margin:0; text-shadow:0 1px rgba(255,255,255,.75); }
.welcome .greeting{ font-family:var(--f-display); font-size:clamp(1.35rem,5vw,2.1rem); line-height:1.35; }
.welcome .hint{ margin-top:7px; color:#80664b; font-size:clamp(.84rem,3vw,1rem); }
@keyframes welcomeIn{ from{ opacity:0; transform:translate(-50%,-10px);} to{ opacity:1; transform:translate(-50%,0);} }
body.s-flap .welcome,body.s-gone .welcome{ display:none; }

/* sequence states */
body.s-flap #flapw,body.s-flap #sealw{ transform:translateY(-62%) translate(0,0); }
body.s-flap #sealw{ transform:translate(-50%,-50%) translateY(-60vh); }
body.s-flap .gate-lang.g{ opacity:0; pointer-events:none; }
body.s-body #front,body.s-body #lining{ transform:translateY(112%); }
body.s-gone #front,body.s-gone #lining,body.s-gone #flapw,body.s-gone #sealw{ display:none; }

/* ===== florals ===== */
#flora{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:14; filter:drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
.critters{ position:fixed; inset:0; pointer-events:none; z-index:15; }
.bf{ position:absolute; width:18px; height:14px; animation:drift var(--t,12s) ease-in-out infinite; animation-delay:var(--dl,0s); }
.bf svg{ width:100%; height:100%; overflow:visible; }
.bf .w{ transform-box:fill-box; transform-origin:50% 50%; animation:flap .28s ease-in-out infinite alternate; }
@keyframes flap{ from{ transform:scaleX(1);} to{ transform:scaleX(.35);} }
@keyframes drift{ 0%,100%{ transform:translate(0,0) rotate(-8deg);} 25%{ transform:translate(12px,-18px) rotate(10deg);} 50%{ transform:translate(-8px,-34px) rotate(-6deg);} 75%{ transform:translate(10px,-14px) rotate(8deg);} }
.bird{ position:absolute; width:54px; top:64%; inset-inline-end:3.5%; animation:bob 3.2s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) rotate(0);} 50%{ transform:translateY(-3px) rotate(-2deg);} }
body.details-visible .bird{ animation:birdTakeoff 1.8s cubic-bezier(.2,.65,.35,1) var(--bird-delay,0s) both; }
@keyframes birdTakeoff{ 0%{ opacity:1; transform:translate(0,0) scale(1) rotate(0);} 35%{ opacity:1; transform:translate(var(--fly-mid-x),-90px) scale(1.05) rotate(-12deg);} 100%{ opacity:0; transform:translate(var(--fly-x),var(--fly-y)) scale(.55) rotate(18deg);} }

/* ===== main ===== */
main{ position:relative; z-index:12; }
.stage{ position:relative; height:100vh; height:100svh; display:grid; place-items:center; }
.card{ position:relative; text-align:center; }
.cardbg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 12px 22px rgba(0,0,0,.4)); pointer-events:none; }
.card > *:not(.cardbg){ position:relative; z-index:1; }
.card.hero{ width:calc(var(--u)*70); height:calc(var(--u)*156); transform:translateY(27vh); transition:transform 4.2s var(--ease); }
body.s-body .card.hero{ transform:none; }
.card.hero > .abs{ position:absolute; }

/* monogram */
.mono{ left:50%; top:calc(var(--u)*44); width:calc(var(--u)*17); transform:translate(-50%,-50%) scale(1.7); opacity:0; z-index:2; transition:opacity 1.4s ease, top 1.5s cubic-bezier(.5,0,.2,1), transform 1.5s cubic-bezier(.5,0,.2,1); }
.mono svg{ display:block; width:100%; height:auto; overflow:visible; }
body.s-mono .mono{ opacity:1; }
body.s-aout .mono{ top:calc(var(--u)*19); transform:translate(-50%,-50%) scale(.72); }

/* stage A: script names + date */
.sa{ left:0; right:0; top:calc(var(--u)*76); }
.sa .script{ font-family:var(--f-script); font-size:calc(var(--u)*9.6); line-height:1.2; padding:0 calc(var(--u)*4); color:var(--ink); clip-path:inset(0 100% 0 0); direction:ltr; }
.sa .dl{ display:flex; align-items:center; gap:calc(var(--u)*2); justify-content:center; margin-top:calc(var(--u)*3); font-size:calc(var(--u)*4.6); color:var(--ink); clip-path:inset(0 0 0 100%); }
:root[dir="ltr"] .sa .dl{ clip-path:inset(0 100% 0 0); }
.sa .dl i{ flex:1; max-width:calc(var(--u)*22); height:1px; background:var(--ink); opacity:.75; }
body.s-a .sa .script{ animation:wipeL 2.2s cubic-bezier(.6,0,.3,1) .1s forwards; }
body.s-a .sa .dl{ animation:wipeR 1.8s cubic-bezier(.6,0,.3,1) 1.1s forwards; }
body.s-aout .sa{ opacity:0; transition:opacity 1.1s ease; }
@keyframes wipeL{ from{ clip-path:inset(0 100% 0 0);} to{ clip-path:inset(0 0 0 0);} }
@keyframes wipeR{ from{ clip-path:inset(0 0 0 100%);} to{ clip-path:inset(0 0 0 0);} }
:root[dir="ltr"] body.s-a .sa .dl{ animation-name:wipeL; }

/* stage B: lines */
.sb{ left:calc(var(--u)*7); right:calc(var(--u)*7); top:calc(var(--u)*32); bottom:calc(var(--u)*9); display:flex; flex-direction:column; justify-content:space-evenly; align-items:center; }
.lb{ opacity:0; margin:0; }
body.s-b .lb{ animation:lnIn 1.1s ease both; animation-delay:var(--d,0ms); }
@keyframes lnIn{ from{ opacity:0; filter:blur(7px); transform:translateY(7px);} to{ opacity:1; filter:none; transform:none;} }
.sb .t1{ font-family:var(--f-display); font-size:calc(var(--u)*5); color:#4a1b22; line-height:1.55; }

.sb .nm{ display:flex; align-items:center; justify-content:space-between; width:calc(100% + var(--u)*8); margin:0 calc(var(--u)*-4) !important; opacity:1 !important; animation:none !important; --sA:calc(var(--u)*18); --sB:calc(var(--u)*-18); }
:root[dir="ltr"] .sb .nm{ --sA:calc(var(--u)*-18); --sB:calc(var(--u)*18); }
.nm .nA,.nm .nB{ font-family:var(--f-display); font-weight:700; font-size:calc(var(--u)*7.8); line-height:1.15; color:#4a1b22; white-space:nowrap; opacity:0; }
.nm .nA{ --s:var(--sA); } .nm .nB{ --s:var(--sB); }
:root[lang="en"] .nm .nA,:root[lang="en"] .nm .nB{ font-style:italic; font-size:calc(var(--u)*6.2); }
.nm .hl{ flex:1 1 auto; min-width:0; height:calc(var(--u)*13); overflow:visible; }
.nm .hl path{ fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.5; stroke-dasharray:100; stroke-dashoffset:100; }
.nm .hl .ln1,.nm .hl .ln2{ stroke:var(--gold); }
.nm .hl .hrt{ stroke:#a6304a; fill:rgba(214,120,140,0); transform-box:fill-box; transform-origin:center; }
body.s-b .nm .nA,body.s-b .nm .nB{ animation:nmIn 1.4s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d); }
body.s-b .nm .hl .ln1,body.s-b .nm .hl .ln2{ animation:drawP 1s ease forwards; animation-delay:calc(var(--d) + 1000ms); }
body.s-b .nm .hl .hrt{ animation:drawP 1.7s ease forwards, fillP 1.2s ease forwards, beatP 1.7s ease-in-out infinite; animation-delay:calc(var(--d) + 1800ms), calc(var(--d) + 3200ms), calc(var(--d) + 4500ms); }
@keyframes nmIn{ from{ opacity:0; transform:translateX(var(--s)); filter:blur(6px);} to{ opacity:1; transform:none; filter:none;} }
@keyframes drawP{ to{ stroke-dashoffset:0; } }
@keyframes fillP{ to{ fill:rgba(214,120,140,.42); } }
@keyframes beatP{ 0%,100%{ transform:scale(1);} 14%{ transform:scale(1.1);} 28%{ transform:scale(1);} 42%{ transform:scale(1.06);} }
.sb .lab{ font-family:var(--f-display); font-size:calc(var(--u)*8.4); color:#4a1b22; line-height:1.2; }
.sb .names{ font-family:var(--f-display); font-weight:700; font-size:calc(var(--u)*11.5); line-height:1.15; color:#4a1b22; }
.sb .names small{ font-size:.55em; color:var(--gold); margin:0 .22em; font-weight:400; }
.sb .when{ font-family:var(--f-display); font-weight:700; font-size:calc(var(--u)*5); color:#4a1b22; line-height:1.4; direction:rtl; }
:root[lang="en"] .sb .when{ direction:ltr; }
.sb .venue{ font-family:var(--f-display); font-size:calc(var(--u)*6.4); color:#4a1b22; line-height:1.25; }
.sb .addr{ font-size:calc(var(--u)*4); color:var(--soft); }
:root[lang="en"] .sb .t1{ font-size:calc(var(--u)*5.4); font-style:italic; }
:root[lang="en"] .sb .lab{ font-size:calc(var(--u)*8.4); font-style:italic; }
:root[lang="en"] .sb .names{ font-style:italic; font-size:calc(var(--u)*10); }
:root[lang="en"] .sb .when{ font-size:calc(var(--u)*5.4); }
:root[lang="en"] .sb .addr{ font-size:calc(var(--u)*4.6); }

.skip,.more{ position:fixed; z-index:45; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); background:rgba(0,0,0,.35); color:#f3e3dc; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:.15em 1.1em; font-size:.95rem; backdrop-filter:blur(4px); transition:opacity .5s; }
.more{ display:grid; place-items:center; width:52px; height:52px; padding:0; background:rgba(63,15,24,.62); border:1px solid rgba(196,154,82,.8); backdrop-filter:blur(5px); color:#f1d69f; opacity:0; pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,.22),inset 0 0 0 4px rgba(255,255,255,.06); }
.more svg{ display:block; width:25px; height:25px; animation:bounce 1.6s ease-in-out infinite; }
.more:hover{ filter:brightness(1.15); }
@keyframes bounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }
body.s-done .skip{ opacity:0; pointer-events:none; }
body.s-done:not(.scrolled) .more{ opacity:.9; pointer-events:auto; }
body:not(.s-flap) .skip{ display:none; }

/* ===== second card ===== */
.more-wrap{ padding:6vh 0 120px; }
.card.two{ width:calc(var(--u)*70); min-width:268px; max-width:380px; margin:0 auto; padding:78px 26px 70px; }
.rv{ opacity:0; transform:translateY(18px); transition:opacity .9s ease, transform .9s ease; }
.rv.in{ opacity:1; transform:none; }
.cameo{ position:relative; width:86%; margin:0 auto; aspect-ratio:1/1.04; border-radius:999px 999px 16px 16px; overflow:hidden; background:#fdfef9; box-shadow:0 0 0 2px var(--card), 0 0 0 3px var(--gold); }
.cameo img{ position:absolute; left:0; bottom:0; width:100%; height:auto; display:block; }
.tag{ font-family:var(--f-display); font-size:1.6rem; color:var(--gold); margin:12px 0 0; }
.sep{ display:block; width:140px; height:16px; margin:20px auto 0; color:var(--gold); }
.verse{ margin:14px auto 0; font-family:var(--f-display); font-size:1.35rem; line-height:2; color:var(--ink); }
:root[lang="en"] .verse{ font-size:1.15rem; line-height:1.5; font-style:italic; }
.verse small{ display:block; font-family:var(--f-body); color:var(--soft); font-size:.8rem; }
.units{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; direction:ltr; margin-top:22px; }
:root[lang="ar"] .units{ direction:rtl; }
.tile{ border:1px solid var(--rose); background:rgba(230,198,201,.25); border-radius:12px; padding:6px 0 2px; }
.tile b{ display:block; font-family:var(--f-display); font-size:1.6rem; line-height:1.1; color:var(--ink); font-variant-numeric:tabular-nums; }
.tile b.t{ animation:blip .5s ease; }
@keyframes blip{ from{ opacity:.3; transform:translateY(-.25em);} to{ opacity:1; transform:none;} }
.tile span{ font-size:.8rem; color:var(--soft); }
.today{ font-family:var(--f-display); font-size:2rem; color:var(--ink); margin:8px 0 0; }
.actions{ display:flex; flex-direction:column; gap:10px; margin:22px 0 0; }
.btn{ display:block; text-decoration:none; padding:.6em 1em; border-radius:999px; border:1px solid var(--ink); color:var(--ink); font-weight:500; transition:background .2s,color .2s; }
.btn:hover{ background:var(--ink); color:var(--card); }
.btn.primary{ background:var(--ink); color:var(--card); }
.btn[hidden]{ display:none; }
.foot{ margin:22px 0 0; color:var(--soft); font-size:.9rem; letter-spacing:.04em; }

.music{ position:fixed; z-index:60; bottom:calc(16px + env(safe-area-inset-bottom,0px)); inset-inline-start:16px; width:46px; height:46px; border-radius:50%; border:1px solid var(--gold); background:var(--wine-d); display:none; place-items:center; box-shadow:0 6px 16px -6px rgba(0,0,0,.6); }
body.s-flap .music{ display:grid; }
.music .eq{ display:flex; gap:3px; align-items:flex-end; height:18px; }
.music .eq i{ display:block; width:3px; border-radius:2px; background:#f0d9a5; height:5px; }
.music.on .eq i{ animation:eq 1s ease-in-out infinite; }
.music.on .eq i:nth-child(2){ animation-delay:.2s; } .music.on .eq i:nth-child(3){ animation-delay:.45s; } .music.on .eq i:nth-child(4){ animation-delay:.1s; }
@keyframes eq{ 0%,100%{ height:5px;} 50%{ height:18px;} }
.music:not(.on)::after{ content:""; position:absolute; width:28px; height:2px; background:#f0d9a5; transform:rotate(-45deg); }
.lang-top{ position:fixed; z-index:44; top:calc(12px + env(safe-area-inset-top,0px)); inset-inline-end:14px; background:rgba(0,0,0,.28); color:#f3e3dc; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:.05em .9em; font-size:.9rem; display:none; }
body.s-body .lang-top{ display:block; }

body.skipping *,body.skipping *::before,body.skipping *::after{ animation-duration:.01s !important; animation-delay:0s !important; transition-duration:.01s !important; transition-delay:0s !important; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01s !important; animation-delay:0s !important; transition-duration:.01s !important; transition-delay:0s !important; }
}
</style>
</head>
<body class="locked">
<svg class="defs" aria-hidden="true"><defs id="defs"></defs></svg>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="lining" aria-hidden="true"></div>
<svg id="flora" aria-hidden="true"></svg>
<div class="critters" id="critters" aria-hidden="true"></div>

<main id="content">
  <section class="stage">
    <div class="card hero" id="card1">
      <svg class="cardbg" aria-hidden="true"></svg>
      <div class="abs mono" aria-hidden="true">
        <svg viewBox="0 0 100 112"><path d="M12 96C28 112 70 112 90 92" fill="none" stroke="#c49a52" stroke-width="3" stroke-linecap="round"/><text x="50" y="84" text-anchor="middle" font-family="Aref Ruqaa, serif" font-weight="700" font-size="96" fill="#6a1f2c">م</text><path fill="#c49a52" d="M76 20c-3-5-10-2-9 3 .6 4 5 6.500 9 10 4-3.500 8.400-6 9-10 1-5-6-8-9-3z"/></svg>
      </div>
      <div class="abs sa">
        <div class="script" data-i18n="scriptNames">Mahmoud &amp; Menna Allah</div>
        <div class="dl"><span data-i18n="dMonth"></span><i></i><span data-i18n="dYear"></span></div>
      </div>
      <div class="abs sb">
        <p class="lb t1" data-i18n="i1"></p>
        <p class="lb t1" data-i18n="i1b"></p>
        <p class="lb t1" data-i18n="i2"></p>
        <div class="lb lab" data-i18n="label"></div>
        <div class="lb nm">
          <span class="nA" data-i18n="n1"></span>
          <svg class="hl" viewBox="0 0 60 40" aria-hidden="true">
            <path class="ln1" pathLength="100" d="M0 21H12.5"/>
            <path class="ln2" pathLength="100" d="M60 21H47.5"/>
            <path class="hrt" pathLength="100" d="M30 36C8 24 6 8 19 6C25.5 5 28 8.5 30 12C32 8.5 34.5 5 41 6C54 8 52 24 30 36Z"/>
          </svg>

/* ----- scalloped arch card outline ----- */
function outline(W,H){
  const b=Math.max(10,W*.055), n=Math.max(12,W*.06), R=Math.min(W*.46,H*.4), cr=Math.min(34,W*.12), rx=W/2-b, cx=W/2, L=[];
  for(let a=90;a<=180;a+=3){ const r=a*Math.PI/180; L.push([cx+rx*Math.cos(r), R-R*Math.sin(r)]); }
  L.push([b*.6,R+n*.12],[b*.2,R+n*.45],[0,R+n]);
  L.push([0,H-cr]);
  for(let a=190;a<=270;a+=10){ const r=a*Math.PI/180; L.push([cr+cr*Math.cos(r), H-cr-cr*Math.sin(r)]); }
  return L.concat(L.slice().reverse().map(([x,y])=>[W-x,y]));
}
function drawCard(card){
  const s = card.querySelector(".cardbg"), W = card.offsetWidth, H = card.offsetHeight; if(!W||!H) return;
  s.setAttribute("viewBox",`0 0 ${W} ${H}`); s.innerHTML = "";
  const id = "cg"+card.id, gd = mk("linearGradient",{id,x1:0,y1:0,x2:0,y2:1}, s);
  mk("stop",{offset:0,"stop-color":"#fbf6ee"}, gd); mk("stop",{offset:1,"stop-color":"#f1e7da"}, gd);
  const pts = o => o.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  mk("polygon",{points:pts(outline(W,H)),fill:`url(#${id})`}, s);
  const i = Math.max(7,W*.03), inner = outline(W-2*i,H-2*i).map(([x,y])=>[x+i,y+i]);
  mk("polygon",{points:pts(inner),fill:"none",stroke:"#e0b9bf","stroke-width":1.5,"stroke-linejoin":"round"}, s);
}

function rose(g, x, y, r, rnd){
  const grp = mk("g",{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(rnd()*360).toFixed(0)})`}, g);
  const c = ROSE[(rnd()*ROSE.length)|0], dark = "rgba(35,0,12,.45)";
  [[6,.62,.46,.92],[5,.5,.4,1],[4,.34,.34,1.1],[3,.18,.3,1.22]].forEach(([n,dist,pr,lt],li)=>{
    const col = shade(c,lt);
    for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2 + li*.5; mk("circle",{cx:(Math.cos(a)*r*dist).toFixed(1),cy:(Math.sin(a)*r*dist).toFixed(1),r:(r*pr).toFixed(1),fill:col,stroke:dark,"stroke-width":.7}, grp); }
  });
  mk("circle",{r:(r*.17).toFixed(1),fill:shade(c,.7),stroke:dark,"stroke-width":.6}, grp);
}

  const r2 = rng(7);
  for(let i=0;i<9;i++){ const e=document.createElement("div"); e.className="bf"; const left = i%2 ? (W-34-r2()*50) : (8+r2()*50); e.style.left = left+"px"; e.style.top = (50 + r2()*(H-140))+"px"; e.style.setProperty("--t",(9+r2()*7).toFixed(1)+"s"); e.style.setProperty("--dl",(-r2()*8).toFixed(1)+"s"); e.innerHTML = bf; cr.appendChild(e); }
  const birdArt = '<svg viewBox="0 0 60 44"><path d="M8 18c4-10 16-14 26-9 6 3 8 8 8 8l9-1-8 7c-1 9-9 16-20 15-9-1-15-8-15-20z" fill="#e0b660" stroke="#8a6420" stroke-width="1"/><path d="M42 17l12-6-6 11z" fill="#c9983f" stroke="#8a6420" stroke-width=".8"/><circle cx="14" cy="16" r="1.6" fill="#3a2410"/><path d="M20 26c4-6 12-6 16 0-4 5-12 6-16 0z" fill="#f3d58f" stroke="#8a6420" stroke-width=".8"/><path d="M26 38l-2 5M32 38l-1 5" stroke="#8a6420" stroke-width="1.4" stroke-linecap="round"/></svg>';
  [{top:"57%",end:"4%",x:"-100vw",y:"-100vh",midX:"0vw",delay:"0s",width:"48px"},

/* ----- countdown ----- */
const target = new Date(CFG.date).getTime(), last = {};
function tick(force){
  const left = target - Date.now(), diff = Math.max(0,left), done = left<=0;
  const v = { cd:Math.floor(diff/864e5), ch:Math.floor(diff/36e5)%24, cm:Math.floor(diff/6e4)%60, cs:Math.floor(diff/1e3)%60 };
  for(const k in v){ const e=$(k); if(force || last[k]!==v[k]){ e.textContent = v[k].toLocaleString(T[lang].locale); if(!force && last[k]!==undefined){ e.classList.remove("t"); void e.offsetWidth; e.classList.add("t"); } } last[k]=v[k]; }
  $("units").hidden = done; $("today").hidden = !done;
}
setInterval(()=>tick(false), 1000);

/* ----- gold sparks ----- */
const FX = (function(){
  const cv = $("fx"), cx = cv.getContext("2d"); let W,H,DPR,parts=[],run=false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
  size(); addEventListener("resize", size);
  function animate(){ if(!run){ run=true; requestAnimationFrame(loop); } }
  function burst(x,y,n,pw){ if(reduce) return; for(let i=0;i<n;i++){ const a=Math.random()*6.283, s=1+Math.random()*(pw||6); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,r:1+Math.random()*2,l:1}); } animate(); }
  function confetti(x,y,count,spread,falling){
    if(reduce) return;
    const colors=["#f6dc9a","#c49a52","#fff1c9","#d9ad57"];
    for(let i=0;i<count;i++){
      parts.push({
        shape:"confetti",x:x+(Math.random()-.5)*spread,y:y+(Math.random()-.5)*24,
        vx:(Math.random()-.5)*(falling?3:11),vy:falling?2+Math.random()*4:-9+Math.random()*7,
        w:4+Math.random()*5,h:8+Math.random()*9,rotation:Math.random()*6.28,
        spin:(Math.random()-.5)*.28,color:colors[i%colors.length],l:1
      });
    }
    animate();
  }
  function loop(){
    cx.clearRect(0,0,W,H);
      for(let i=parts.length-1;i>=0;i--){
        const p=parts[i]; p.vx*=p.shape==="confetti" ? .992 : .985; p.vy=p.vy*.995+(p.shape==="confetti" ? .12 : .06); p.x+=p.vx; p.y+=p.vy; p.l-=p.shape==="confetti" ? .006 : .014;
      if(p.l<=0 || p.y>H+30){ parts.splice(i,1); continue; }
      cx.globalAlpha=p.l;
      if(p.shape==="confetti"){ cx.save(); cx.translate(p.x,p.y); p.rotation+=p.spin; cx.rotate(p.rotation); cx.fillStyle=p.color; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); }
      else { cx.fillStyle="#f6dc9a"; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill(); }
    }
    cx.globalAlpha=1; if(parts.length) requestAnimationFrame(loop); else { run=false; cx.clearRect(0,0,W,H); }
  }
  addEventListener("pointerdown", e=>{ if(document.body.classList.contains("s-done") && !e.target.closest("a,button")) burst(e.clientX,e.clientY,14,4); });
  function celebrate(x,y){
    if(reduce) return;
    burst(x,y,72,7);
    confetti(x,y,120,innerWidth*.9,false);
    setTimeout(()=>confetti(innerWidth*.5,-12,100,innerWidth*.95,true),220);
    setTimeout(()=>confetti(innerWidth*.5,-12,80,innerWidth*.95,true),520);
  }
  return { burst, celebrate };
})();

/* ----- music: your song, looped ----- */
const Music = (function(){
  const audio = $("backgroundMusic");
  let playing=false, wantsPlay=false, startPositionSet=false;
  function seekToStartPosition(){
    if(startPositionSet || audio.readyState < 1) return;
    audio.currentTime = 8;
    startPositionSet = true;
  }
  audio.addEventListener("loadedmetadata", seekToStartPosition);
  function start(){
    wantsPlay = true;
    seekToStartPosition();
    const result = audio.play();
    if(result && result.then) result.then(()=>{ playing = true; syncMusicBtn(); }).catch(e=>{
      playing = false; wantsPlay = false; syncMusicBtn();
      console.error("Unable to play wedding music.", e);
    });
  }
  function stop(){ wantsPlay = false; playing = false; audio.pause(); syncMusicBtn(); }
  audio.addEventListener("error", ()=>{ playing = false; wantsPlay = false; syncMusicBtn(); console.error("Unable to load wedding music.", audio.error); });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) audio.pause(); else if(wantsPlay) start(); });
  return { start, stop, get on(){ return playing; } };
})();
function syncMusicBtn(){ const b=$("music"); b.classList.toggle("on", Music.on); b.setAttribute("aria-pressed", String(Music.on)); }
$("music").addEventListener("click", ()=>{ try{ Music.on ? Music.stop() : Music.start(); }catch(e){ console.error("Unable to toggle wedding music.", e); } syncMusicBtn(); });

/* ----- reveal on scroll for the second card ----- */
(function(){
  const io = new IntersectionObserver(es=> es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.2});
  document.querySelectorAll(".rv").forEach((e,i)=>{ e.style.transitionDelay = (i%3)*90+"ms"; io.observe(e); });
  addEventListener("scroll", ()=> document.body.classList.toggle("scrolled", scrollY > innerHeight*.3), {passive:true});
  const detailsObserver = new IntersectionObserver(entries=>{
    document.body.classList.toggle("details-visible", entries.some(entry=>entry.isIntersecting));
  }, {threshold:.08});
  detailsObserver.observe($("more"));
  $("moreBtn").addEventListener("click", ()=> $("more").scrollIntoView({behavior:"smooth"}));
})();

/* ----- the opening sequence (matches the reference: flap lifts, envelope drops, card + florals, monogram, script names, then the lines) ----- */
(function(){ document.querySelectorAll(".sb .lb").forEach((e,i)=> e.style.setProperty("--d", (i*850)+"ms")); })();
let opened = false, timers = [], done = false;
const B = document.body;
function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
function finish(){
  if(done) return; done = true;
  ["s-flap","s-body","s-mono","s-a","s-aout","s-b","s-done"].forEach(c=>B.classList.add(c));
  B.classList.remove("locked");
}
function openInvite(e){
  if(opened || (e && e.target.closest && e.target.closest("#gateLang"))) return; opened = true;
  try{ Music.start(); }catch(err){} syncMusicBtn();
  const r = $("sealw").getBoundingClientRect(); FX.celebrate(r.left+r.width/2, r.top+r.height/2);
  B.classList.add("s-flap");
  at(1800,  ()=> B.classList.add("s-body"));
  at(5000,  ()=> B.classList.add("s-mono"));
  at(6600,  ()=> B.classList.add("s-a"));
  at(10600, ()=> B.classList.add("s-aout"));
  at(11900, ()=> B.classList.add("s-b"));
  at(11900 + document.querySelectorAll(".sb .lb").length*850 + 4200, ()=>{ B.classList.add("s-done"); B.classList.remove("locked"); done = true; });
  at(6100, ()=>{ B.classList.remove("locked"); });
  at(6300, ()=> B.classList.add("s-gone"));
}
document.addEventListener("click", function once(e){ if(opened) return; if(e.target.closest && e.target.closest("#gateLang")) return; openInvite(e); }, true);
$("skip").addEventListener("click", ()=>{ B.classList.add("skipping"); finish(); timers.forEach(clearTimeout); B.classList.add("s-gone"); setTimeout(()=> B.classList.remove("skipping"), 200); });
if(matchMedia("(prefers-reduced-motion: reduce)").matches){ $("sealw").addEventListener("click", ()=> setTimeout(()=>{ finish(); B.classList.add("s-gone"); }, 50)); }

applyLang();
</script>
</body>
</html>
